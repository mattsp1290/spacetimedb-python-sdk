[mypy]
# Global configuration for SpacetimeDB Python SDK type checking
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
strict_concatenate = True

# Allow missing imports for external dependencies that might not have stubs
ignore_missing_imports = True

# Be strict about None/Optional handling
strict_optional = True

# Files to check
files = src/spacetimedb_sdk

# Module-specific configurations
[mypy-tests.*]
# Allow test files to be less strict
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-spacetimedb_sdk.bsatn.*]
# BSATN module should be strictly typed due to binary data handling
strict = True

[mypy-spacetimedb_sdk.websocket_client]
# WebSocket client should be strictly typed for network reliability
strict = True

[mypy-spacetimedb_sdk.protocol.*]
# Protocol modules should be strictly typed for compatibility
strict = True

[mypy-spacetimedb_sdk.auth.*]
# Authentication modules should be strictly typed for security
strict = True

[mypy-spacetimedb_sdk.security.*]
# Security modules require strictest typing
strict = True

# Ignore missing stubs for certain external libraries
[mypy-websocket.*]
ignore_missing_imports = True

[mypy-keyring.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-brotli.*]
ignore_missing_imports = True