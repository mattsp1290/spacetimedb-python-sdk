[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetimedb_sdk"
authors = [
    { name = "Clockwork Labs", email = "john@clockworklabs.io" },
]

dependencies = [
    "websocket-client",
    "configparser",
    "brotli",
    "keyring>=23.0.0",
    "cryptography>=3.4.0",
    "PyJWT>=2.4.0",
]
version = "0.7.0"
readme = "README.md"

# urls
# Should describe where to find useful info for your project
[project.urls]
homepage = "https://spacetimedb.com"
repository = "https://github.com/clockworklabs/spacetimedb-python-sdk"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "flake8>=6.0.0",
    "pytest-cov>=4.1.0",
]
compression = [
    "brotli>=1.0.9",
]
json-api = [
    "requests>=2.31.0",      # Sync HTTP client (simplest)
    "aiohttp>=3.8.0",        # Async HTTP client (recommended)
]
secure-storage = [
    "keyring>=23.0.0",       # System keyring for secure credential storage
    "cryptography>=3.4.0",   # Encryption for fallback file storage
    "PyJWT>=2.4.0",          # JWT token handling and validation
]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output and execution options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
    "--disable-warnings",
]

# Registered markers to avoid warnings
markers = [
    "integration: Integration tests requiring external services",
    "unit: Fast unit tests",
    "slow: Slow running tests",
    "security: Security-related tests",
    "performance: Performance benchmarking tests",
    "asyncio: Asynchronous tests",
    "property: Property-based tests",
    "regression: Regression tests for bug fixes",
]

# Asyncio configuration to fix deprecation warnings
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Minimum version and timeouts
minversion = "7.0"
timeout = 300

# Filtering
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]
