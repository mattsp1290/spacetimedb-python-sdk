tasks:
  - id: sdk-v112-1
    name: WebSocket URL Structure Update
    status: not-started
    description: Update WebSocket connection URLs to use new v1.1.2 format
    subtasks:
      - Update WebSocketClient URL construction:
          - Add `/v1/ws/` prefix to all WebSocket URLs
          - Change from `/database/{name}/subscribe` to `/v1/ws/database/{name}/subscribe`
          - Add support for `db_identity` query parameter
          - Maintain backward compatibility with fallback logic
      - Modify connection parameters:
          - Add `db_identity` parameter to WebSocketClient.connect()
          - Update URL building logic in spacetime_websocket_client.py
          - Ensure query parameters are properly encoded
          - Handle missing db_identity gracefully
      - Update SpacetimeDBClient interface:
          - Add `db_identity` parameter to init() method
          - Pass through to WebSocketClient
          - Document new parameter requirements
          - Add deprecation warnings for old usage
    references:
      - spacetime_websocket_client.py line 21-30 (connect method)
      - MIGRATION_GUIDE_v1.1.2.md (URL structure examples)
    verification: Connection URLs include /v1/ws/ prefix and db_identity parameter
    priority: critical (breaking change)

  - id: sdk-v112-2
    name: Protocol Header Updates
    status: not-started
    description: Update WebSocket subprotocol from v1.text to supported v1.1.2 protocols
    subtasks:
      - Fix hardcoded protocol string:
          - Change "v1.text.spacetimedb" to "v1.json.spacetimedb"
          - Location: spacetimedb_client.py line with WebSocketClient init
          - Make protocol configurable, not hardcoded
          - Support both text and binary protocols
      - Add protocol negotiation:
          - Support "v1.json.spacetimedb" and "v1.bin.spacetimedb"
          - Allow protocol selection during client initialization
          - Handle protocol rejection errors
          - Fallback to compatible protocols
      - Update connection headers:
          - Ensure Sec-WebSocket-Protocol is properly set
          - Add protocol version to connection metadata
          - Log negotiated protocol for debugging
          - Handle protocol mismatch errors
    references:
      - spacetimedb_client.py (WebSocketClient initialization)
      - V1_1_2_COMPATIBILITY_CHANGES.md (protocol analysis)
    verification: Server accepts connection with new protocol headers
    priority: critical (connection fails without this)

