          - Fall back to old format if 404
          - Log deprecation warnings for old format
          - Track protocol version for debugging
      - Error recovery mechanisms:
          - Automatic retry with correct protocol
          - Graceful degradation for old servers
          - Connection state recovery
          - Better timeout handling
    references:
