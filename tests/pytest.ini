[pytest]
# Optimized pytest configuration for SpacetimeDB Python SDK Integration Tests
# Designed to handle 596 tests reliably without timeouts

# Test discovery - comprehensive patterns for all test types
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_* *_test

# Enhanced output and execution options for reliability
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --maxfail=15
    --durations=25
    --timeout=300
    --timeout-method=thread
    --junit-xml=tests/test-results.xml
    --html=tests/test-report.html --self-contained-html
    --json-report --json-report-file=tests/test-report.json
    -rf

# Comprehensive markers for better test categorization and filtering
markers =
    integration: Integration tests requiring external services
    unit: Unit tests (fast, < 1s)
    slow: Slow running tests (> 5s)  
    very_slow: Very slow tests (> 30s)
    asyncio: Async tests
    security: Security tests
    performance: Performance tests and benchmarks
    property: Property-based tests using Hypothesis
    wasm: WebAssembly integration tests
    network: Tests that require network connectivity
    mock_network: Tests using mocked network connections
    websocket: WebSocket connection tests
    real_connection: Tests that explicitly require real connections (use with caution)
    offline: Tests that should work offline
    memory: Memory usage and leak tests
    concurrent: Concurrency and thread safety tests
    regression: Regression tests for specific bug fixes
    timeout_prone: Tests known to potentially timeout
    flaky: Tests that may be unreliable
    v112: Tests specific to v1.1.2 compatibility
    bsatn: Tests for BSATN encoding/decoding
    auth: Authentication and authorization tests
    protocol: Protocol-level tests
    client: Client functionality tests
    mock_server: Tests using mock server infrastructure
    end_to_end: Complete end-to-end scenario tests

# Asyncio configuration - enhanced for stability
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Minimum version requirement
minversion = 7.0

# Primary timeout configuration - balanced for integration tests
timeout = 300  # 5 minutes per test - aligned with main configuration
timeout_method = thread

# Hypothesis configuration for property-based tests
# Note: these are set via pytest.ini but controlled by Hypothesis profiles

# Enhanced logging for debugging hanging tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters to reduce noise while preserving important warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning  
    ignore::UserWarning:websocket.*
    ignore::ResourceWarning
    ignore::RuntimeWarning:.*unclosed.*
    default::UserWarning:spacetimedb_sdk.*  # Keep our own warnings

# Collection and caching optimization
norecursedirs = build dist *.egg-info .git .tox .pytest_cache __pycache__
cache_dir = .pytest_cache

# pytest-xdist configuration for parallel execution  
# Enables running with: pytest -n auto (auto-detect cores) or -n 4 (4 workers)
# dist = worksteal  # Better load balancing (commented out - not a valid ini option)