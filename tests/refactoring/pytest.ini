[pytest]
# Minimal pytest configuration for refactoring tests
# Inherits most settings from main pyproject.toml

# Refactoring-specific test discovery
testpaths = tests/refactoring

# Refactoring-specific coverage and output paths
addopts = 
    --cov=spacetimedb_sdk.websocket_client
    --cov-report=html:tests/refactoring/coverage_html
    --cov-report=xml:tests/refactoring/coverage.xml
    --cov-fail-under=23
    --junit-xml=tests/refactoring/test_results.xml

# Note: All markers are now centrally defined in the main pyproject.toml
# This includes the refactoring-specific markers: api_compatibility, mock_server, end_to_end

# Refactoring-specific fixture configuration
usefixtures = cleanup_after_test

# Refactoring-specific cache directory
cache_dir = tests/refactoring/.pytest_cache