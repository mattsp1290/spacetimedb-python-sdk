[tool:pytest]
# Pytest configuration for Phase 2 refactoring tests

# Test discovery
testpaths = tests/refactoring
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    regression: Regression tests to ensure no functionality breaks
    module: Isolated module tests
    integration: Integration tests for module interactions
    performance: Performance and benchmarking tests
    slow: Tests that take more than 1 second to run
    api_compatibility: API backward compatibility tests
    mock_server: Tests that use mock server infrastructure
    end_to_end: Complete end-to-end scenario tests
    memory: Memory usage and leak tests
    concurrent: Concurrency and thread safety tests
    wasm: WebAssembly integration tests

# Minimum version requirements
minversion = 6.0

# Test output configuration
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes
    --disable-warnings
    --cov=spacetimedb_sdk.websocket_client
    --cov-report=term-missing
    --cov-report=html:tests/refactoring/coverage_html
    --cov-report=xml:tests/refactoring/coverage.xml
    --cov-fail-under=85
    --junit-xml=tests/refactoring/test_results.xml

# Performance test configuration
timeout = 60
timeout_method = thread

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websocket.*

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Fixture configuration
usefixtures = cleanup_after_test

# Collection configuration
collect_ignore = ["setup.py", "conftest.py"]

# Cache configuration
cache_dir = tests/refactoring/.pytest_cache