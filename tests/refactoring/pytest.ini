[pytest]
# Refactoring-specific pytest configuration
# Inherits main settings from pyproject.toml - only overrides specific paths

# Test discovery for refactoring directory only
testpath = .
python_files = test_*.py

# Refactoring-specific output paths
addopts = 
    --junit-xml=test_results.xml
    -v
    --tb=short

# Refactoring-specific fixture configuration  
usefixtures = cleanup_after_test

# Local cache directory
cache_dir = .pytest_cache